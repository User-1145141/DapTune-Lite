name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      # - name: Validate profile contract
      #   run: node tools/validate-profile-contract.mjs
