name: Bug report
description: 报告可复现的 DAP、导入、界面或自动切换问题
title: "[Bug] "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交范围
      options:
        - label: 我使用本仓库 Release 或可复现的当前源码构建。
          required: true
        - label: 我已经阅读兼容性与故障排查文档。
          required: true
        - label: 我已删除个人数据、地址、序列号、账户信息、厂商文件和签名材料。
          required: true
  - type: input
    attributes:
      label: DapTune 版本
      placeholder: 例如 0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    attributes:
      label: Android、设备代号与固件
      placeholder: Android 版本 / device codename / 完整但不含序列号的固件版本
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 输出路径
      options:
        - 手机扬声器
        - 3.5 mm 有线耳机
        - 蓝牙或 LE Audio
        - USB 音频
        - HDMI 或远程输出
        - 与输出无关
        - 无法确定
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 包含播放器及其 offload、独占、解码器或输出设置。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望与实际行为
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最小脱敏日志
      description: 只附 DapTune 对应时间段或最小 descriptor/路由证据。
      render: text
    validations:
      required: true
